<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한토막 - 토론 타이머</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-dark: #0f1117;
    --pro-blue: #003b71;
    --white: #ffffff;
    --danger: #ef4444;
    --text-dim-on-dark: #6b7084;
    --text-dim-on-light: #5a6b85;
    --text-dim-on-blue: #9bb3cf;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #ffffff;
    color: var(--pro-blue);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== 화면 전환 ===== */
  .screen { display: none; width: 100%; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ===== 홈 화면 ===== */
  #screen-home {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #fff;
  }
  .home-bg-img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 90vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    z-index: 0;
    opacity: 0.95;
  }
  .home-overlay {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .home-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 24px;
  }
  .home-btn {
    padding: 20px 44px;
    border: 2px solid var(--pro-blue);
    background: rgba(255,255,255,0.85);
    
    color: var(--pro-blue);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 20px;
    font-weight: 700;
    transition: all 0.2s;
    min-width: 180px;
  }
  .home-btn:hover {
    background: var(--pro-blue);
    color: var(--white);
    transform: translateY(-2px);
  }
  .home-btn .btn-sub {
    display: block;
    font-size: 12px;
    opacity: 0.75;
    margin-top: 6px;
    font-weight: 500;
  }

  /* ===== 타이머 화면 공통 레이아웃 (좌측 내비 + 우측 본문) ===== */
  .timer-screen {
    flex-direction: row;
    align-items: stretch;
  }

  /* ===== 좌측 파트 내비게이션 (세로 컬럼, 토글 가능) ===== */
  .phase-nav-side {
    width: 240px;
    flex-shrink: 0;
    padding: 24px 16px;
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid rgba(127,127,127,0.25);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: width 0.25s ease, padding 0.25s ease;
    position: relative;
  }
  /* 접힌 상태 */
  .phase-nav-side.collapsed {
    width: 0;
    padding: 24px 0;
    border-right: none;
  }
  .phase-nav-side.collapsed > *:not(.nav-toggle-inner) {
    display: none;
  }

  /* 비활성 화면의 토글 버튼은 숨김 (홈 화면 등) */
  .screen:not(.active) .nav-toggle { display: none; }

  /* 사이드바 토글 버튼 (외부 플로팅) */
  .nav-toggle {
    position: fixed;
    top: 16px;
    left: 252px;
    z-index: 100;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.15);
    color: var(--pro-blue);
    cursor: pointer;
    font-size: 21px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.25s ease, background 0.2s, color 0.2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .nav-toggle:hover {
    background: var(--pro-blue);
    color: #fff;
  }
  /* 전체화면 토글 버튼 (우상단 플로팅) */
  .fs-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.15);
    color: var(--pro-blue);
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .fs-toggle:hover { background: var(--pro-blue); color: #fff; }
  .screen:not(.active) .fs-toggle { display: none; }
  body.mode-con .fs-toggle {
    background: rgba(0,0,0,0.85);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }
  body.mode-con .fs-toggle:hover { background: #fff; color: #000; }

  /* 사이드바 접힌 상태에서는 토글 버튼이 왼쪽 끝으로 */
  body.nav-collapsed .nav-toggle {
    left: 12px;
  }
  /* 반대측에서는 토글 버튼 색상 검정 톤 */
  body.mode-con .nav-toggle {
    background: rgba(0,0,0,0.85);
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }
  body.mode-con .nav-toggle:hover {
    background: #fff;
    color: #000;
  }

  .back-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid currentColor;
    color: inherit;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  .back-btn:hover { opacity: 1; }

  .nav-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.5;
    margin-bottom: 4px;
    padding: 0 4px;
  }


  .phase-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .phase-list .phase-btn {
    width: 100%;
    display: block;
  }

  .phase-btn {
    padding: 10px 14px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    text-align: left;
    opacity: 0.55;
  }
  .phase-btn:hover { opacity: 0.85; }
  .phase-btn.active {
    opacity: 1;
    background: currentColor;
  }
  .phase-btn.active span { color: var(--phase-bg-color, #fff); }

  /* ===== 우측 본문 영역 ===== */
  .timer-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    transition: background 0.4s, color 0.4s;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    background: #ffffff;
    color: var(--pro-blue);
  }
  /* 찬성/긍정측: 흰 배경 + 파란 글자 */
  .timer-main.theme-pro {
    background: #ffffff;
    color: var(--pro-blue);
  }
  /* 반대/부정측: 검정 배경 + 흰 글자 */
  .timer-main.theme-con {
    background: #000000;
    color: #ffffff;
  }
  /* 중립(숙의시간/자유토론): 흰 배경 */
  .timer-main.theme-neutral {
    background: #ffffff;
    color: var(--pro-blue);
  }

  /* ===== 워터마크 (측별 로고) ===== */
  .watermark-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 850px;
    max-width: 80vw;
    max-height: 75vh;
    pointer-events: none !important;
    z-index: 0;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 자유토론(neutral)에서는 저울 워터마크를 더 크게 */
  .timer-main.theme-neutral .watermark-wrap {
    width: 1200px;
    height: 1200px;
    max-width: 95vw;
    max-height: 95vh;
  }
  .watermark-wrap * { pointer-events: none !important; }
  .watermark-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }
  /* 찬성측: 흰 배경 위 → 파란 로고 워터마크 */
  .timer-main.theme-pro .watermark-wrap img {
    opacity: 0.15;
  }
  /* 자유토론(neutral): 저울 워터마크 */
  .timer-main.theme-neutral .watermark-wrap img {
    opacity: 0.12;
  }
  /* 반대측: 파란 배경 위 → 흰 라인 로고 (SVG 자체가 흰색) */
  .timer-main.theme-con .watermark-wrap img {
    opacity: 0.2;
  }

  /* 좌측 nav: 찬성 = 파란 배경 + 흰 글자 */
  body.mode-pro .phase-nav-side {
    background: var(--pro-blue);
    color: #ffffff;
    border-right: 1px solid #002a52;
  }
  /* 좌측 nav: 중립 = 흰 배경 + 파란 글자 */
  body.mode-neutral .phase-nav-side {
    background: #f4f6fa;
    color: var(--pro-blue);
    border-right: 1px solid #d8dde8;
  }
  /* 좌측 nav: 반대 = 검정 배경 + 흰 글자 */
  body.mode-con .phase-nav-side {
    background: #111111;
    color: #ffffff;
    border-right: 1px solid #333333;
  }
  /* 활성 파트 버튼 텍스트 색상 */
  body.mode-pro .phase-btn.active span { color: var(--pro-blue); }
  body.mode-neutral .phase-btn.active span { color: #ffffff; }
  body.mode-con .phase-btn.active span { color: #000000; }

  h1 {
    font-size: 37px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }
  .info-text {
    font-size: 15px;
    opacity: 0.7;
    margin-bottom: 24px;
  }

  .timer-area {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    position: relative;
    z-index: 2;
    max-width: 1100px;
    padding: 0;
  }
  /* 찬성측: 살짝 흰 반투명으로 워터마크 가려서 가독성 확보 */
  
  /* 반대측: 살짝 파란 반투명 */
  

  .phase-title {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
  }

  .single-timer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .time-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 138px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
    transition: color 0.2s;
  }

  /* 5초 이하 빨간색 점멸 */
  .time-display.danger { color: var(--danger) !important; animation: pulse 0.8s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ===== Dual Timer ===== */
  .dual-timer {
    display: flex;
    gap: 24px;
    width: 100%;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .dual-side {
    flex: 1;
    min-width: 0;
    max-width: 560px;
    background: transparent;
    border: 4px solid currentColor;
    border-radius: 16px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    transition: all 0.2s;
    opacity: 0.92;
  }

  .dual-side.active-side { opacity: 1; border-width: 3px; }

  .side-label { font-size: 25px; font-weight: 700; letter-spacing: 1px; }

  .dual-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 138px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;
  }
  .dual-time.danger { color: var(--danger) !important; animation: pulse 0.8s ease-in-out infinite; }

  .speech-timer-label { font-size: 15px; opacity: 0.75; font-weight: 600; }

  .speech-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 96px;
    font-weight: 700;
  }
  .speech-timer.danger { color: var(--danger) !important; animation: pulse 0.8s ease-in-out infinite; }

  .dual-btn {
    padding: 10px 22px;
    background: transparent;
    border: 2px solid currentColor;
    color: inherit;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 700;
    transition: all 0.15s;
  }
  .dual-btn:hover:not(:disabled) { background: currentColor; }
  .dual-btn:hover:not(:disabled) span { color: var(--phase-bg-color, #fff); }
  .dual-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ===== 컨트롤 버튼 (테두리형) ===== */
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-btn {
    padding: 12px 28px;
    background: transparent;
    border: 2px solid currentColor;
    color: inherit;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 700;
    transition: all 0.15s;
  }

  .ctrl-btn:hover:not(:disabled) {
    background: currentColor;
  }
  /* hover 시 텍스트는 배경색으로 — span으로 감싸기 */
  .ctrl-btn:hover:not(:disabled) .btn-label {
    color: var(--phase-bg-color, #fff);
  }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* hover 시 currentColor가 배경이 되면 텍스트는 배경색으로 반전 */
  .timer-main.theme-pro { --phase-bg-color: #ffffff; }
  .timer-main.theme-con { --phase-bg-color: #000000; }
  .timer-main.theme-neutral { --phase-bg-color: #ffffff; }
  body .phase-nav-side { --phase-bg-color: #ffffff; }

  .progress-bar {
    width: 100%;
    max-width: 400px;
    height: 4px;
    background: currentColor;
    opacity: 0.25;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: currentColor;
    opacity: 1;
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  /* ===== 반응형 ===== */
  @media (max-width: 720px) {
    .timer-screen { flex-direction: column; }
    .phase-nav-side {
      width: 100%;
      max-height: 200px;
      border-right: none;
      border-bottom: 1px solid rgba(127,127,127,0.25);
    }
    .time-display { font-size: 92px; }
    .dual-time { font-size: 46px; }
  }

  /* ===== 종료(Q&A FeedBack) 화면 ===== */

  .timer-main.theme-ending {
    background: var(--pro-blue);
    color: var(--white);
    padding: 0;
  }
  /* ending 모드에서는 timer-area의 max-width 제약을 풀고 영역을 가득 채움 */
  .timer-main.theme-ending .timer-area {
    margin-top: 0;
    max-width: none;
    width: 100%;
    height: 100%;
    flex: 1;
  }
  body.mode-ending .phase-nav-side {
    background: var(--pro-blue);
    color: #ffffff;
    border-right: 1px solid #002a52;
  }
  body.mode-ending .phase-btn.active span { color: var(--pro-blue); }

  .ending-screen {
    background: var(--pro-blue);
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    width: 100%;
    flex: 1;
    min-height: 100vh;
    animation: endingFadeIn 1.2s ease both;
  }
  @keyframes endingFadeIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  .ending-screen .ending-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 120px;
    font-weight: 700;
    font-style: normal;
    letter-spacing: 0;
    line-height: 1.1;
  }
  .ending-screen .ending-subtitle {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 80px;
    font-weight: 400;
    letter-spacing: 0;
    opacity: 0.9;
  }
  @media (max-width: 720px) {
    .ending-screen .ending-title { font-size: 64px; letter-spacing: 0; }
    .ending-screen .ending-subtitle { font-size: 44px; letter-spacing: 0; }
  }
</style>
</head>

  if (!nav) return;
  nav.classList.toggle('collapsed');
  document.body.classList.toggle('nav-collapsed', nav.classList.contains('collapsed'));
}

/* 전체화면 토글 (프로젝터/전광판용) */
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  } catch (e) {}
}

/* ============================================
 *  화면 전환
 * ============================================ */
function goToScreen(name) {
  stopTimer();

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');

  // 사이드바는 항상 펼친 상태로 시작
  document.querySelectorAll('.phase-nav-side').forEach(n => n.classList.remove('collapsed'));
  document.body.classList.remove('nav-collapsed');

  if (name === 'bantomak' || name === 'ceda') {
    currentMode = name;
    currentPhase = 0;
    buildNav();
    renderPhase();
  } else {
    // home
    document.body.className = 'mode-neutral';
  }
}

/* ============================================
 *  공통 상태
 * ============================================ */
let currentMode = null;
let currentPhase = 0;
let timer = null;

let remaining = 0;
let totalTime = 0;
let isRunning = false;

let proRemaining = 0;
let conRemaining = 0;
let speechRemaining = 0;
let activeSide = null;
let dualRunning = false;

/* 절대시간 기반 타이머용 (백그라운드 탭 throttling 무력화)
 * - startTime: 현재 진행 구간 시작 timestamp
 * - initialRemaining: startTime 시점의 남은 초
 * - dualSpeechStart: 듀얼 발언 타이머 시작 timestamp
 * - dualSpeechInitial: 발언 타이머 시작 시점의 남은 초
 */
let startTime = 0;
let initialRemaining = 0;
let dualSpeechStart = 0;
let dualSpeechInitial = 0;
const TICK_MS = 250;  // 화면 갱신 빈도 (4Hz, 부드러움 + CPU 부담 적음)

function getPhases() {
  return currentMode === 'ceda' ? PHASES_CEDA : PHASES_BANTOMAK;
}
function getNavEl()  { return document.getElementById('phaseNav-' + currentMode); }
function getAreaEl() { return document.getElementById('timerArea-' + currentMode); }
function getMainEl() { return document.getElementById('timerMain-' + currentMode); }

/* ============================================
 *  유틸
 * ============================================ */
let audioCtx = null;
function playBell() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    osc.start(t); osc.stop(t + 1.4);
  } catch (e) {}
}
// 사용자 제스처(시작 클릭) 시점에 오디오를 미리 깨워둠 → 첫 종소리 무음 방지
function primeAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function fmt(sec) {
  const m = Math.floor(Math.max(0, sec) / 60);
  const s = Math.max(0, sec) % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// 20초 이하 danger
function timeClass(sec) {
  if (sec <= 20) return 'danger';
  return '';
}

/* ============================================
 *  테마 적용 (측별 배경 SVG)
 * ============================================ */
/* ============================================
 *  활성 화면 내 DOM 검색 헬퍼 (ID 충돌 방지)
 * ============================================ */
function $a(id) {
  const active = document.querySelector('.screen.active');
  if (!active) return document.getElementById(id);
  return active.querySelector('#' + id) || document.getElementById(id);
}

function applyTheme(side) {
  const main = getMainEl();
  if (!main) return;
  main.classList.remove('theme-pro', 'theme-con', 'theme-neutral', 'theme-ending');
  document.body.classList.remove('mode-pro', 'mode-con', 'mode-neutral', 'mode-ending');

  // 기존 워터마크 컨테이너 제거
  const oldWm = main.querySelector('.watermark-wrap');
  if (oldWm) oldWm.remove();

  let themeClass = 'theme-neutral';
  let mode = 'mode-neutral';
  let wmSrc = null;

  if (side === 'pro') {
    themeClass = 'theme-pro'; mode = 'mode-pro';
    wmSrc = WATERMARK_LOGO;
  } else if (side === 'con') {
    themeClass = 'theme-con'; mode = 'mode-con';
    wmSrc = WATERMARK_WHITE;
  } else if (side === 'both') {
    // 자유토론: 저울 워터마크
    themeClass = 'theme-neutral'; mode = 'mode-neutral';
    wmSrc = WATERMARK_SCALE;
  } else if (side === 'ending') {
    themeClass = 'theme-ending'; mode = 'mode-ending';
    wmSrc = null;
  }
  // 'neutral'은 워터마크 없음

  main.classList.add(themeClass);
  document.body.classList.add(mode);

  // 워터마크 컨테이너 + 이미지 삽입 (timer-area 앞에)
  if (wmSrc) {
    const wrap = document.createElement('div');
    wrap.className = 'watermark-wrap';
    const img = document.createElement('img');
    img.src = wmSrc;
    img.alt = '';
    wrap.appendChild(img);
    main.insertBefore(wrap, main.firstChild);
  }
}

/* ============================================
 *  내비게이션
 * ============================================ */
function buildNav() {
  const nav = getNavEl();
  if (!nav) return;
  nav.innerHTML = '';
  const phases = getPhases();
  phases.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'phase-btn' + (i === currentPhase ? ' active' : '');
    const lbl = document.createElement('span');
    lbl.textContent = (i + 1) + '. ' + p.name;
    btn.appendChild(lbl);
    btn.onclick = () => switchPhase(i);
    nav.appendChild(btn);
  });
}

function switchPhase(idx) {
  stopTimer();
  currentPhase = idx;
  buildNav();
  renderPhase();
}

function stopTimer() {
  if (timer) { clearInterval(timer); timer = null; }
  isRunning = false;
  dualRunning = false;
}

/* ============================================
 *  렌더링 디스패치
 * ============================================ */
function renderPhase() {
  const phase = getPhases()[currentPhase];
  const area = getAreaEl();
  if (!area) return;

  applyTheme(phase.side);

  if (phase.type === 'ending') {
    renderEnding(phase, area);
  } else if (phase.type === 'dual') {
    renderDual(phase, area);
  } else {
    renderSingle(phase, area);
  }
}

/* ============================================
 *  Ending Screen (Q&A / FeedBack)
 * ============================================ */
function renderEnding(phase, area) {
  stopTimer();
  area.innerHTML = `
    <div class="ending-screen">
      <div class="ending-title">Q&A</div>
      <div class="ending-subtitle">FeedBack</div>
    </div>
  `;
}

/* ============================================
 *  Single Timer
 * ============================================ */
function renderSingle(phase, area) {
  stopTimer();
  remaining = phase.time;
  totalTime = phase.time;
  isRunning = false;

  area.innerHTML = `
    <div class="phase-title">${phase.name}</div>
    <div class="single-timer">
      <div class="time-display" id="timeDisp">${fmt(remaining)}</div>
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:100%"></div></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="playBtn"  onclick="singlePlay()"><span class="btn-label">▶ 시작</span></button>
      <button class="ctrl-btn" id="pauseBtn" onclick="singlePause()" disabled><span class="btn-label">⏸ 정지</span></button>
      <button class="ctrl-btn"               onclick="renderPhase()"><span class="btn-label">↺ 초기화</span></button>
      <button class="ctrl-btn"               onclick="nextPhase()"><span class="btn-label">다음 ▸</span></button>
    </div>
  `;
}

function singlePlay() {
  if (isRunning || remaining <= 0) return;
  primeAudio();
  isRunning = true;
  $a('playBtn').disabled  = true;
  $a('pauseBtn').disabled = false;

  // 절대시간 기준점 설정 (현재 remaining을 기준으로 시작)
  startTime = performance.now();
  initialRemaining = remaining;

  timer = setInterval(() => {
    // 실제 경과시간 = 현재시간 - 시작시간 (백그라운드 throttle에 영향 없음)
    const elapsed = Math.floor((performance.now() - startTime) / 1000);
    remaining = Math.max(0, initialRemaining - elapsed);
    updateSingleDisplay();
    if (remaining <= 0) {
      stopTimer();
      playBell();
      $a('playBtn').disabled  = true;
      $a('pauseBtn').disabled = true;
    }
  }, TICK_MS);
}

function singlePause() {
  // 정지 시 현재 remaining 값은 setInterval 콜백에서 이미 갱신되어 있음
  stopTimer();
  $a('playBtn').disabled  = false;
  $a('pauseBtn').disabled = true;
}

function updateSingleDisplay() {
  const disp = $a('timeDisp');
  const fill = $a('progFill');
  if (!disp) return;
  disp.textContent = fmt(remaining);
  disp.className = 'time-display ' + timeClass(remaining);
  fill.style.width = (remaining / totalTime * 100) + '%';
}

/* ============================================
 *  Dual Timer
 * ============================================ */
function renderDual(phase, area) {
  stopTimer();
  proRemaining = phase.time;
  conRemaining = phase.time;
  speechRemaining = phase.speechLimit;
  activeSide = null;
  dualRunning = false;

  area.innerHTML = `
    <div class="phase-title">${phase.name}</div>
    <div class="info-text">각 팀 ${phase.time / 60}분 보유 · 1회 발언 최대 ${phase.speechLimit}초</div>
    <div class="dual-timer">
      <div class="dual-side" id="proSide" style="color:#1e40af">
        <div class="side-label">찬성</div>
        <div class="dual-time" id="proTime">${fmt(proRemaining)}</div>
        <div class="speech-timer-label">발언 시간</div>
        <div class="speech-timer" id="proSpeech">${fmt(phase.speechLimit)}</div>
        <button class="dual-btn" id="proBtn" onclick="dualStart('pro')"><span class="btn-label">찬성 발언</span></button>
      </div>
      <div class="dual-side" id="conSide" style="color:#000000">
        <div class="side-label">반대</div>
        <div class="dual-time" id="conTime">${fmt(conRemaining)}</div>
        <div class="speech-timer-label">발언 시간</div>
        <div class="speech-timer" id="conSpeech">${fmt(phase.speechLimit)}</div>
        <button class="dual-btn" id="conBtn" onclick="dualStart('con')"><span class="btn-label">반대 발언</span></button>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="dualPauseBtn" onclick="dualPause()" disabled><span class="btn-label">⏸ 정지</span></button>
      <button class="ctrl-btn"                   onclick="renderPhase()"><span class="btn-label">↺ 초기화</span></button>
      <button class="ctrl-btn"                   onclick="nextPhase()"><span class="btn-label">다음 ▸</span></button>
    </div>
  `;
}

function dualStart(side) {
  const phase = getPhases()[currentPhase];
  primeAudio();

  if (timer) { clearInterval(timer); timer = null; }

  if (activeSide !== side) {
    speechRemaining = phase.speechLimit;
  }
  // [동기화] 남은 보유시간이 발언 제한보다 적으면 발언시간을 보유시간에 맞춤
  const sideRemain = (side === 'pro') ? proRemaining : conRemaining;
  if (speechRemaining > sideRemain) {
    speechRemaining = sideRemain;
  }

  activeSide = side;
  dualRunning = true;

  startTime = performance.now();
  initialRemaining = (side === 'pro') ? proRemaining : conRemaining;
  dualSpeechStart = performance.now();
  dualSpeechInitial = speechRemaining;

  const proSpeechEl = $a('proSpeech');
  const conSpeechEl = $a('conSpeech');
  if (side === 'pro') {
    proSpeechEl.textContent = fmt(speechRemaining);
    proSpeechEl.className   = 'speech-timer';
    conSpeechEl.textContent = fmt(Math.min(phase.speechLimit, conRemaining));
    conSpeechEl.className   = 'speech-timer';
  } else {
    conSpeechEl.textContent = fmt(speechRemaining);
    conSpeechEl.className   = 'speech-timer';
    proSpeechEl.textContent = fmt(Math.min(phase.speechLimit, proRemaining));
    proSpeechEl.className   = 'speech-timer';
  }

  $a('proSide').classList.toggle('active-side', side === 'pro');
  $a('conSide').classList.toggle('active-side', side === 'con');
  $a('proBtn').disabled = (side === 'pro') || (proRemaining <= 0);
  $a('conBtn').disabled = (side === 'con') || (conRemaining <= 0);
  $a('dualPauseBtn').disabled = false;

  timer = setInterval(() => {
    const elapsedHold = Math.floor((performance.now() - startTime) / 1000);
    const elapsedSpeech = Math.floor((performance.now() - dualSpeechStart) / 1000);

    if (activeSide === 'pro') {
      proRemaining = Math.max(0, initialRemaining - elapsedHold);
    } else {
      conRemaining = Math.max(0, initialRemaining - elapsedHold);
    }
    speechRemaining = Math.max(0, dualSpeechInitial - elapsedSpeech);

    updateDualDisplay();

    // 발언 종료 판정: '발언 제한 도달' 또는 '발언 중인 측의 보유시간 소진'
    // (다른 측이 이미 0이어도 현재 발언 측에는 영향 없음 → 버튼 잠금 버그 방지)
    const activeRemain = (activeSide === 'pro') ? proRemaining : conRemaining;
    if (speechRemaining <= 0 || activeRemain <= 0) {
      clearInterval(timer); timer = null;
      dualRunning = false;
      playBell();  // 한 번의 종료 이벤트에 종소리 정확히 1회
      activeSide = null;
      speechRemaining = phase.speechLimit;
      $a('proSide').classList.remove('active-side');
      $a('conSide').classList.remove('active-side');
      // 버튼 disabled는 '해당 측 보유시간이 0인가'만으로 판정
      $a('proBtn').disabled = (proRemaining <= 0);
      $a('conBtn').disabled = (conRemaining <= 0);
      // 발언시간 표시는 min(발언 제한, 해당 측 보유 잔여)으로 보정
      $a('proSpeech').textContent = fmt(Math.min(phase.speechLimit, proRemaining));
      $a('proSpeech').className   = 'speech-timer';
      $a('conSpeech').textContent = fmt(Math.min(phase.speechLimit, conRemaining));
      $a('conSpeech').className   = 'speech-timer';
      // 양측 모두 소진된 경우에만 정지 버튼 비활성화
      if (proRemaining <= 0 && conRemaining <= 0) {
        $a('dualPauseBtn').disabled = true;
      }
    }
  }, TICK_MS);
}

function dualPause() {
  if (timer) { clearInterval(timer); timer = null; }
  dualRunning = false;
  $a('proBtn').disabled = (proRemaining <= 0);
  $a('conBtn').disabled = (conRemaining <= 0);
  $a('dualPauseBtn').disabled = true;
}

function updateDualDisplay() {
  const pt = $a('proTime');
  const ct = $a('conTime');
  const ps = $a('proSpeech');
  const cs = $a('conSpeech');

  if (pt) {
    pt.textContent = fmt(proRemaining);
    pt.className = 'dual-time ' + timeClass(proRemaining);
  }
  if (ct) {
    ct.textContent = fmt(conRemaining);
    ct.className = 'dual-time ' + timeClass(conRemaining);
  }

  if (activeSide === 'pro' && ps) {
    ps.textContent = fmt(speechRemaining);
    ps.className = 'speech-timer' + (speechRemaining <= 20 ? ' danger' : '');
  } else if (activeSide === 'con' && cs) {
    cs.textContent = fmt(speechRemaining);
    cs.className = 'speech-timer' + (speechRemaining <= 20 ? ' danger' : '');
  }
}

/* ============================================
 *  다음 파트
 * ============================================ */
function nextPhase() {
  const phases = getPhases();
  if (currentPhase < phases.length - 1) {
    switchPhase(currentPhase + 1);
  }
}
</script>
</body>
</html>
